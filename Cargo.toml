[package]
name = "git-ignore"
version = "0.1.0"
description = "A lightweight CLI for generating, analyzing, linting, organizing, and maintaining .gitignore files."
authors = ["Irfan Ghat <irfanghat@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
