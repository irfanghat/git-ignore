[package]
name = "git-ignore"
version = "0.1.0"
description = "A lightweight CLI for generating, analyzing, linting, organizing, and maintaining .gitignore files."
documentation = "https://github.com/irfanghat/git-ignore/blob/main/README.md"
repository = "https://github.com/irfanghat/git-ignore/"
readme = "README.md"
license-file = "LICENSE"
authors = ["Irfan Ghat <irfanghat@gmail.com>"]
keywords = ["cli", "dev-tools"]
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
include_dir = "0.7.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.12.0"
