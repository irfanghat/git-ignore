name: Publish Crate

on:
  workflow_dispatch:
    
jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish package
        run: cargo publish